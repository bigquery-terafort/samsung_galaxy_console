name: Samsung Galaxy Store → BigQuery (JSON key)

# ════════════════════════════════════════════════════════════════════════════
#  SAMSUNG GALAXY STORE SYNC                                        v1.0
#
#  ⏰ TARTEEB (poore pipeline mein):
#       03:30 UTC   samsung_sync          ← YE
#       ...         baqi loaders
#       07:24       saari *_staging
#       08:00       dlight_master_merge
#       08:05       samsung_master_merge
#       08:15       unified_daily_performance
#
#  🔐 SECRETS (Settings → Secrets and variables → Actions):
#       SAMSUNG_SERVICE_ACCOUNT_ID   Seller Portal → Assistance → API Service
#       SAMSUNG_PRIVATE_KEY          wahi se download hui private key (poori,
#                                    -----BEGIN PRIVATE KEY----- ke saath)
#       GCP_SA_KEY                   BigQuery wale service account ki JSON key
#                                    (poori file ka content, { se } tak)
#
#  ⚠️ NOTE: ye JSON-KEY wala variant hai. Agar aage WIF laga do to
#     `samsung_sync_wif.yml` use karna — wo zyada mehfooz hai.
#
#  📋 GCP_PROJECT + BQ_DATASET
#       Variables mein rakho YA Secrets mein — workflow dono se parh leti hai.
#       GCP_PROJECT   terafort
#       BQ_DATASET    samsung
# ════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 🔁 HAR 15 MINUTE — public repo par Actions FREE hai.
    #    Har run pehle BQ se poochti hai "kal ka data hai?" — hai to 10 sec
    #    mein skip. Nahi to poora loader (45 din MERGE). Der ≤ ~20 min.
    - cron: '*/15 * * * *'

  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Kitne din peeche tak (default 14)'
        required: false
        default: '45'
      backfill_start:
        description: 'Backfill shuru (YYYY-MM-DD) — khali chhodo to lookback chalega'
        required: false
        default: ''
      backfill_end:
        description: 'Backfill khatam (YYYY-MM-DD)'
        required: false
        default: ''
      dry_run:
        description: 'DRY RUN — BigQuery ko haath na lagao'
        type: boolean
        required: false
        default: false
      chunk_days:
        description: 'Ek call mein kitne din (default 30)'
        required: false
        default: '30'

# 🛡️ ek waqt mein ek hi run — do saath chalein to MERGE takraa sakti hai
concurrency:
  group: samsung-sync
  cancel-in-progress: false

permissions:
  contents: read         # JSON key mein id-token ki zaroorat nahi

jobs:
  sync:
    name: Samsung → BigQuery
    runs-on: ubuntu-latest
    timeout-minutes: 60          # 🛡️ atak jaye to khud mar jaye

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🔐 JSON key se auth
      - name: Google Cloud auth (JSON key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ══════════════════════════════════════════════════════════════════════
      # 🔧 bq CLI — self-heal/verify ke liye. WAHI secret jo loader use karta hai.
      #    Koi naya secret nahi.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🔧 setup-gcloud (bq CLI)"
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # ══════════════════════════════════════════════════════════════════════
      # 🩺 SELF-HEAL ① — PEHLE ki haalat yaad rakho (rollback/verify ke liye)
      # ══════════════════════════════════════════════════════════════════════
      - name: "🩺 Pehle ki haalat — rows aur aakhri din"
        id: before
        continue-on-error: true
        run: |
          set +e
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date) AS STRING) FROM \`terafort.samsung.samsung_daily_app\`" 2>/dev/null | tail -1)
          ROWS=$(echo "$R" | cut -d, -f1); LAST=$(echo "$R" | cut -d, -f2)
          echo "📊 pehle: ${ROWS:-?} rows · aakhri din ${LAST:-?}"
          echo "rows=${ROWS:-0}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST:-}"  >> "$GITHUB_OUTPUT"
          # ── gap dekh kar lookback tay karo ──
          LB="${{ github.event.inputs.lookback_days || '45' }}"
          if [[ "$LAST" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            if [ "$GAP" -gt "$LB" ]; then
              LB=$(( GAP + 3 )); [ "$LB" -gt 180 ] && LB=180
              echo "::warning::🩺 Self-heal: data ${GAP} din purana — lookback ${LB} kiya"
            fi
          else
            # ── 🛡️ SAFETY NET: bq nahi chala (setup-gcloud nahi?) ──
            #    Bina jaanch ke har 15 min poora loader chalana = platform API par
            #    bojh (rate limit). Is liye sirf GHANTE KE SHURU mein chalao
            #    (:00–:14) — yani purane 1-ghanta cron jaisa. Baqi 15-min skip.
            MIN=$((10#$(date -u +%M)))
            if [ "$MIN" -ge 15 ]; then
              echo "⚠️ BQ check nahi ho saka — sirf ghante ke shuru mein chalta hoon (abhi :$MIN) — skip"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "lookback=$LB" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⚠️ BQ check nahi ho saka — ghante ka shuru hai, loader chalega (lookback $LB)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ── 🔑 SKIP: kal ka data pehle se hai to kuch mat karo ──
          YESTERDAY=$(date -u -d yesterday +%F)
          if [[ "$LAST" > "$YESTERDAY" ]] || [[ "$LAST" == "$YESTERDAY" ]]; then
            echo "✅ kal ka data ($LAST) pehle se hai — skip, kuch nahi karna"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "🔍 kal ($YESTERDAY) ka data nahi — loader chalega"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "lookback=$LB" >> "$GITHUB_OUTPUT"

      # 🔁 RETRY — neeche wala main step 3 baar koshish karta hai.
      #    (nick-fields/retry se: platform API 5xx / timeout par khud dobara)

      - name: Samsung sync
        if: steps.before.outputs.skip != 'true'
        env:
          # ── Samsung ──
          SAMSUNG_SERVICE_ACCOUNT_ID: ${{ secrets.SAMSUNG_SERVICE_ACCOUNT_ID }}
          SAMSUNG_PRIVATE_KEY:        ${{ secrets.SAMSUNG_PRIVATE_KEY }}

          # ── BigQuery ──
          # 🔧 vars YA secrets — jahan bhi rakhe hon, dono se parh lega
          GCP_PROJECT: ${{ vars.GCP_PROJECT || secrets.GCP_PROJECT }}
          BQ_DATASET:  ${{ vars.BQ_DATASET || secrets.BQ_DATASET || 'samsung' }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION || secrets.BQ_LOCATION || 'US' }}

          # ── range ──
          LOOKBACK_DAYS:  ${{ steps.before.outputs.lookback || github.event.inputs.lookback_days || '45' }}
          BACKFILL_START: ${{ github.event.inputs.backfill_start || '' }}
          BACKFILL_END:   ${{ github.event.inputs.backfill_end   || '' }}
          CHUNK_DAYS:     ${{ github.event.inputs.chunk_days     || '30' }}

          # ── guards ──
          DRY_RUN:              ${{ github.event.inputs.dry_run || 'false' }}
          MAX_RETRIES:          '5'
          THROTTLE_MS:          '400'
          REQUEST_TIMEOUT:      '90'
          FAIL_THRESHOLD_PCT:   '0'      # 🛡️ ek app bhi fail = kuch na likho
          TOTAL_BUDGET_SECONDS: '3300'   # 55 min (job timeout 60 hai)
        run: python scripts/samsung_to_bigquery.py

      - name: 🔴 Nakaami par batao
        if: failure()
        run: |
          echo "::error::Samsung sync NAKAAM — BigQuery mein kuch nahi likha gaya (FAIL CLOSED)"
          {
            echo "### 🔴 Samsung sync nakaam"
            echo ""
            echo "**FAIL CLOSED** — adhoora data BigQuery mein nahi gaya."
            echo ""
            echo "Dekhne wali cheezein:"
            echo "- \`SAMSUNG_PRIVATE_KEY\` poori hai? (BEGIN/END lines ke saath)"
            echo "- \`SAMSUNG_SERVICE_ACCOUNT_ID\` Seller Portal wali hi hai?"
            echo "- Service account revoke to nahi hua?"
            echo "- Samsung API down to nahi? https://developer.samsung.com/system-status"
          } >> "$GITHUB_STEP_SUMMARY"

      # ══════════════════════════════════════════════════════════════════════
      # 🛡️ SELF-HEAL ② — BAAD mein VERIFY. Kharab data mile to run LAAL.
      # ══════════════════════════════════════════════════════════════════════
      #  Teen check:
      #    1. rows KAM to nahi ho gaye  (koi loader TRUNCATE kar ke mar gaya?)
      #    2. aakhri din PEECHE to nahi gaya
      #    3. aaj ke window mein NEGATIVE ya NULL key to nahi
      #  Koi bhi fail → exit 1 → workflow red → tum ko pata chalega.
      #  🔑 Loader khud MERGE karta hai, is liye rollback ki zaroorat nahi —
      #     purana data waise hi mehfooz rehta hai.
      - name: "🛡️ Baad mein verify — bad data nahi jaana chahiye"
        if: always() && steps.before.outputs.skip != 'true'
        run: |
          set +e
          BEFORE_ROWS="${{ steps.before.outputs.rows || '0' }}"
          BEFORE_LAST="${{ steps.before.outputs.last || '' }}"
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date) AS STRING), COUNTIF(date IS NULL) FROM \`terafort.samsung.samsung_daily_app\`" 2>/dev/null | tail -1)
          if [ -z "$R" ]; then
            echo "::warning::verify skip — bq query nahi chali (setup-gcloud hai?)"
            exit 0
          fi
          AFTER_ROWS=$(echo "$R" | cut -d, -f1); AFTER_LAST=$(echo "$R" | cut -d, -f2); NULLS=$(echo "$R" | cut -d, -f3)
          echo "📊 baad:  ${AFTER_ROWS} rows · aakhri din ${AFTER_LAST} · null dates ${NULLS}"
          FAIL=0
          # 1. rows 5% se zyada KAM ho gaye = kuch toota
          if [ "$BEFORE_ROWS" -gt 100 ] && [ "$AFTER_ROWS" -lt $(( BEFORE_ROWS * 95 / 100 )) ]; then
            echo "::error::🔴 ROWS KAM HO GAYE: $BEFORE_ROWS → $AFTER_ROWS — loader ne data URA DIYA"; FAIL=1
          fi
          # 2. aakhri din peeche gaya
          if [[ "$BEFORE_LAST" =~ ^[0-9]{4} ]] && [[ "$AFTER_LAST" < "$BEFORE_LAST" ]]; then
            echo "::error::🔴 AAKHRI DIN PEECHE GAYA: $BEFORE_LAST → $AFTER_LAST"; FAIL=1
          fi
          # 3. null date key
          if [ "${NULLS:-0}" -gt 0 ]; then
            echo "::error::🔴 ${NULLS} rows par date NULL hai — kharab data"; FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::🔴 VERIFY FAIL — is run ka data bharosay ke qabil NAHI"
            exit 1
          fi
          echo "✅ verify pass — $(( AFTER_ROWS - BEFORE_ROWS )) rows badhe"

      # ══════════════════════════════════════════════════════════════════════
      # 📣 NAKAAMI PAR BATAO — chup-chaap fail na ho
      # ══════════════════════════════════════════════════════════════════════
      - name: "📣 Fail hua to summary mein likho"
        if: failure()
        run: |
          {
            echo "## 🔴 ${{ github.workflow }} — NAKAAM"
            echo "- run: ${{ github.run_id }}"
            echo "- waqt: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- pehle: ${{ steps.before.outputs.rows }} rows · ${{ steps.before.outputs.last }}"
            echo "- 🔁 agli scheduled run khud dobara koshish karegi (din mein 4x)"
            echo "- 🩺 self-heal gap dekh kar lookback barha dega"
          } >> "$GITHUB_STEP_SUMMARY"
